<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" role="img" aria-label="Sketch: setup portal on a phone with fields for Wi-Fi, server URL, update password and brightness">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:#1d1d1f}
    .m{fill:#6e6e73}
  </style>
  <rect x="6" y="6" width="288" height="548" rx="44" fill="#fff" stroke="#d2d2d7" stroke-width="2"/>
  <rect x="112" y="20" width="76" height="20" rx="10" fill="#1d1d1f"/>
  <text x="34" y="74" font-size="11" class="m">Wi-Fi: GlanceBox-A1B2</text>
  <text x="34" y="110" font-size="22" font-weight="700">Glance Box setup</text>
  <text x="34" y="150" font-size="12" class="m">Wi-Fi network</text>
  <rect x="34" y="158" width="232" height="34" rx="9" fill="#f5f5f7"/>
  <text x="46" y="180" font-size="13">MyHomeWiFi</text>
  <text x="34" y="214" font-size="12" class="m">Password</text>
  <rect x="34" y="222" width="232" height="34" rx="9" fill="#f5f5f7"/>
  <text x="46" y="244" font-size="13">••••••••••</text>
  <text x="34" y="278" font-size="12" class="m">Server URL</text>
  <rect x="34" y="286" width="232" height="34" rx="9" fill="#f5f5f7" stroke="#0071e3" stroke-width="1.5"/>
  <text x="46" y="308" font-size="13">http://192.168.1.50:8080</text>
  <text x="34" y="342" font-size="12" class="m">Update password (user admin)</text>
  <rect x="34" y="350" width="232" height="34" rx="9" fill="#f5f5f7"/>
  <text x="46" y="372" font-size="13">••••••••</text>
  <text x="34" y="406" font-size="12" class="m">Brightness (5–100 %)</text>
  <rect x="34" y="414" width="232" height="34" rx="9" fill="#f5f5f7"/>
  <text x="46" y="436" font-size="13">80</text>
  <rect x="34" y="474" width="232" height="44" rx="12" fill="#0071e3"/>
  <text x="150" y="502" text-anchor="middle" font-size="15" font-weight="600" fill="#fff" style="fill:#fff">Save</text>
</svg>
