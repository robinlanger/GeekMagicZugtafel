[platformio]
default_envs = native

[env:native]
platform = native@1.2.1
test_build_src = no
build_flags = -std=gnu++17 -Wall -Wextra
lib_deps = core, tjpgd
test_ignore = test_embedded_*

[env:ultra]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
upload_speed = 460800
monitor_speed = 115200
extra_scripts = pre:scripts/version.py, post:scripts/no_float_stdio.py
build_src_filter = +<*> -<spike_main.cpp>
build_unflags = -std=gnu++11
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    tzapu/WiFiManager@2.0.17
test_ignore = *
build_flags =
    -std=gnu++17
    -Wall
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_CS=-1
    -DTFT_DC=0
    -DTFT_RST=2
    -DTFT_SCLK=14
    -DTFT_MOSI=13
    -DTFT_SPI_MODE=SPI_MODE3
    -DSPI_FREQUENCY=40000000
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DWM_NODEBUG

[env:spike]
extends = env:ultra
build_src_filter = +<spike_main.cpp> +<display.cpp>

; Boot-loop guard test image: aborts 5 s after boot (see src/main.cpp). Never ship.
[env:ultra-crashtest]
extends = env:ultra
build_flags =
    ${env:ultra.build_flags}
    -DGB_CRASH_TEST
