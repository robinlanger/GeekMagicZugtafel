{% extends "base.html" %}
{% block head %}
<style>
.clock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.time{font-weight:700;font-size:72px;line-height:1;}
.weekday{margin-top:14px;font-size:22px;font-weight:700;}
.date{margin-top:4px;font-size:18px;color:var(--muted);}
</style>
{% endblock %}
{% block body %}
<div class="clock">
  <div class="time">{{ time }}</div>
  <div class="weekday">{{ weekday }}</div>
  <div class="date">{{ date }}</div>
</div>
{% endblock %}
