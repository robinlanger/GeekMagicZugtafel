services:
  glancebox:
    build: .
    image: glancebox:dev
    container_name: glancebox
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      # Your own pages; create the folder first (mkdir pages-custom), it may be empty.
      - ./pages-custom:/config/pages:ro
